version: '3.9'

services:
  # SQLite State Store (File-based, no container needed)
  # Data persists in .tasks/state.db

  # Redis Cache Layer
  redis:
    image: redis:7-alpine
    container_name: orchestration-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - REDIS_REPLICATION_BACKLOG_SIZE=1048576

  # PostgreSQL (Optional: for audit logs if scaling beyond SQLite)
  postgres:
    image: postgres:15-alpine
    container_name: orchestration-postgres
    environment:
      POSTGRES_DB: orchestration
      POSTGRES_USER: orch_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestration_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orch_user"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - postgres  # Run with: docker-compose --profile postgres up

  # Monitoring: Prometheus (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: orchestration-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - monitoring  # Run with: docker-compose --profile monitoring up

  # Monitoring: Grafana (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: orchestration-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # Log Aggregation: Loki (Optional)
  loki:
    image: grafana/loki:latest
    container_name: orchestration-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    profiles:
      - monitoring

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  default:
    name: orchestration-network
    driver: bridge
